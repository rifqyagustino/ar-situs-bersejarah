<!DOCTYPE html>
<html>
  <head>
    <title>AR Situs Bersejarah</title>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    
    <!-- Import Libraries -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <!-- Import Custom Interactions -->
    <script src="assets/js/interaction.js"></script>

    <style>
      /* Style untuk Info Panel (Overlay) */
      #info-panel {
        display: none;
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 85%;
        max-width: 400px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        flex-direction: column;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        z-index: 1000;
        animation: slideUp 0.3s ease-out;
      }

      @keyframes slideUp {
        from { bottom: -100px; opacity: 0; }
        to { bottom: 20px; opacity: 1; }
      }

      #info-panel h2 {
        margin: 0 0 10px 0;
        color: #333;
        font-size: 1.2rem;
      }

      #info-panel p {
        margin: 0 0 15px 0;
        color: #555;
        font-size: 0.9rem;
        line-height: 1.4;
      }

      #close-btn {
        background: #d9534f;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
      }

      /* Petunjuk Gestur */
      #gesture-instruction {
        position: fixed;
        top: 10px;
        width: 100%;
        text-align: center;
        color: white;
        text-shadow: 1px 1px 2px black;
        font-family: sans-serif;
        pointer-events: none;
        z-index: 999;
      }
      
      /* Loading Screen sederhana */
      .arjs-loader {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .arjs-loader div {
        text-align: center;
        font-size: 1.25em;
        color: white;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <!-- Loader -->
    <div class="arjs-loader">
      <div>Loading AR...</div>
    </div>

    <!-- UI Overlay: Petunjuk -->
    <div id="gesture-instruction">
      <p>Arahkan ke Marker. <br> 👆 Geser: Putar | 🤏 Cubit: Zoom | 👇 Tap: Info</p>
    </div>

    <!-- UI Overlay: Info Panel -->
    <div id="info-panel">
      <!-- ID ditambahkan agar bisa diupdate oleh Javascript -->
      <h2 id="info-title">Informasi Situs</h2>
      <p id="info-text">Deskripsi situs akan muncul di sini.</p>
      <button id="close-btn" onclick="document.getElementById('info-panel').style.display='none'">Tutup</button>
    </div>

    <!-- A-Frame Scene -->
    <a-scene
      embedded
      arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
      renderer="logarithmicDepthBuffer: true; colorManagement: true; precision: medium; antialias: false; alpha: true;"
      vr-mode-ui="enabled: false"
      gesture-detector 
      id="scene"
      cursor="rayOrigin: mouse; fuse: false" 
      raycaster="objects: .clickable; interval: 500" 
    >
      
      <!-- Asset Management -->
      <a-assets timeout="10000">
        <a-asset-item id="borobudur-glb" src="assets/models/borobudur.glb"></a-asset-item>
        <a-asset-item id="pyramid-glb" src="assets/models/pyramid.glb"></a-asset-item>
        <a-asset-item id="taj-mahal-glb" src="assets/models/taj_mahal.glb"></a-asset-item>
      </a-assets>

      <!-- Pencahayaan -->
      <a-entity light="type: ambient; intensity: 1.2;"></a-entity>
      <a-entity light="type: directional; intensity: 0.8; position: -1 2 1"></a-entity>

      <!-- 1. Candi Borobudur -->
      <a-marker 
        type="pattern" 
        url="assets/markers/pattern-borobudur.patt"
        emitevents="true"
        smooth="true"
        smoothCount="5"
        smoothTolerance="0.01"
        smoothThreshold="2"
      >
        <a-entity 
          gltf-model="#borobudur-glb"
          position="0 0 0" 
          scale="0.5 0.5 0.5"
          rotation="0 0 0"
          class="clickable"
          gesture-handler
          info-click-handler="title: Candi Borobudur; text: Borobudur adalah candi Buddha terbesar di dunia yang dibangun pada abad ke-9 Masehi oleh Wangsa Syailendra di Magelang, Jawa Tengah."
        >
        </a-entity>
      </a-marker>

      <!-- 2. Piramida Giza -->
      <a-marker 
        type="pattern" 
        url="assets/markers/pattern-pyramid.patt"
        emitevents="true"
        smooth="true"
        smoothCount="5"
        smoothTolerance="0.01"
        smoothThreshold="2"
      >
        <a-entity 
          gltf-model="#pyramid-glb"
          position="0 0 0" 
          scale="0.05 0.05 0.05"
          rotation="0 0 0"
          class="clickable"
          gesture-handler
          info-click-handler="title: Piramida Agung Giza; text: Piramida tertua dan terbesar dari tiga piramida di Nekropolis Giza, Mesir. Dibangun sebagai makam untuk Firaun Khufu sekitar tahun 2560 SM."
        >
        </a-entity>
      </a-marker>

      <!-- 3. Taj Mahal -->
      <a-marker 
        type="pattern" 
        url="assets/markers/pattern-taj-mahal.patt"
        emitevents="true"
        smooth="true"
        smoothCount="5"
        smoothTolerance="0.01"
        smoothThreshold="2"
      >
        <a-entity 
          gltf-model="#taj-mahal-glb"
          position="0 0 0" 
          scale="0.05 0.05 0.05"
          rotation="0 0 0"
          class="clickable"
          gesture-handler
          info-click-handler="title: Taj Mahal; text: Sebuah mausoleum marmer putih di Agra, India. Dibangun oleh kaisar Mughal Shah Jahan untuk mengenang istri kesayangannya, Mumtaz Mahal."
        >
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      document.querySelector('a-scene').addEventListener('loaded', function () {
        document.querySelector('.arjs-loader').style.display = 'none';
      });
    </script>
  </body>
</html>
