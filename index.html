<!DOCTYPE html>
<html>
  <head>
    <title>AR Situs Bersejarah Dunia</title>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    
    <!-- Import Libraries -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <!-- Import Custom Interactions -->
    <script src="assets/js/interaction.js"></script>

    <style>
      /* Style untuk Info Panel (Overlay) */
      #info-panel {
        display: none;
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 85%;
        max-width: 400px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        flex-direction: column;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        z-index: 1000;
        animation: slideUp 0.3s ease-out;
      }

      @keyframes slideUp {
        from { bottom: -100px; opacity: 0; }
        to { bottom: 20px; opacity: 1; }
      }

      #info-title {
        margin: 0 0 10px 0;
        color: #333;
        font-size: 1.3rem;
        font-weight: bold;
      }

      #info-text {
        margin: 0 0 15px 0;
        color: #555;
        font-size: 0.95rem;
        line-height: 1.5;
      }

      #close-btn {
        background: #d9534f;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        align-self: flex-end;
      }

      /* Petunjuk Gestur */
      #gesture-instruction {
        position: fixed;
        top: 10px;
        width: 100%;
        text-align: center;
        color: white;
        text-shadow: 1px 1px 2px black;
        font-family: sans-serif;
        pointer-events: none;
        z-index: 999;
      }
      
      .arjs-loader {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .arjs-loader div {
        text-align: center;
        font-size: 1.25em;
        color: white;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <div class="arjs-loader">
      <div>Loading AR Assets...</div>
    </div>

    <div id="gesture-instruction">
      <p>Arahkan ke Marker (Pattern/Barcode 1-7). <br> 👆 Geser: Putar | 👇 Tap: Info</p>
    </div>

    <!-- UI Overlay: Info Panel Dinamis -->
    <div id="info-panel">
      <div id="info-title">Judul</div>
      <div id="info-text">Deskripsi</div>
      <button id="close-btn" onclick="document.getElementById('info-panel').style.display='none'">Tutup</button>
    </div>

    <!-- A-Frame Scene -->
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
      renderer="logarithmicDepthBuffer: true; colorManagement: true;"
      vr-mode-ui="enabled: false"
      gesture-detector 
      id="scene"
      cursor="rayOrigin: mouse; fuse: false" 
      raycaster="objects: .clickable" 
    >
      
      <!-- A. Asset Management -->
      <a-assets>
        <a-asset-item id="borobudur-glb" src="assets/models/borobudur.glb"></a-asset-item>
        <a-asset-item id="taj-mahal-glb" src="assets/models/taj_mahal.glb"></a-asset-item>
        <a-asset-item id="chichen-itza-glb" src="assets/models/chichen_itza_pyramid_3d_reconstruction.glb"></a-asset-item>
        <a-asset-item id="giza-glb" src="assets/models/the_great_pyramid_of_giza.glb"></a-asset-item>
        <a-asset-item id="pisa-glb" src="assets/models/torre_pisa.glb"></a-asset-item>
        <a-asset-item id="petra-glb" src="assets/models/ad-deir_monastery_petra_jordan.glb"></a-asset-item>
        <a-asset-item id="angkor-glb" src="assets/models/angkor_wat.glb"></a-asset-item>
        <a-asset-item id="khertvisi-glb" src="assets/models/khertvisi_fortress_-_raw_scan.glb"></a-asset-item>
      </a-assets>

      <!-- B. Pencahayaan -->
      <a-entity light="type: ambient; intensity: 0.8;"></a-entity>
      <a-entity light="type: directional; intensity: 1; position: 1 4 2"></a-entity>


      <!-- C. MARKERS -->

      <!-- 1. BOROBUDUR (Custom Pattern Marker) -->
      <a-marker type="pattern" url="assets/markers/pattern-borobudur.patt" smooth="true">
        <a-entity 
          gltf-model="#borobudur-glb"
          position="0 0 0" 
          scale="0.5 0.5 0.5" 
          class="clickable"
          gesture-handler
          info-click-handler="title: Candi Borobudur; text: Candi Buddha terbesar di dunia (Abad ke-9) di Magelang, Indonesia. Memiliki struktur punden berundak dan ribuan panel relief."
        >
        </a-entity>
      </a-marker>

      <!-- 2. TAJ MAHAL (Custom Pattern Marker) -->
      <a-marker type="pattern" url="assets/markers/pattern-taj-mahal.patt" smooth="true">
        <a-entity 
          gltf-model="#taj-mahal-glb"
          position="0 0 0" 
          scale="0.02 0.02 0.02" 
          class="clickable"
          gesture-handler
          info-click-handler="title: Taj Mahal; text: Mausoleum marmer putih di Agra, India. Dibangun oleh Kaisar Shah Jahan (1632) untuk mengenang istri tercintanya, Mumtaz Mahal."
        >
        </a-entity>
      </a-marker>

      <!-- 3. CHICHEN ITZA (Barcode 2) -->
      <a-marker type="barcode" value="2" smooth="true">
        <a-entity 
          gltf-model="#chichen-itza-glb"
          position="0 0 0" 
          scale="0.05 0.05 0.05" 
          class="clickable"
          gesture-handler
          info-click-handler="title: Chichen Itza; text: Kota suci suku Maya di Meksiko. Struktur terkenalnya adalah piramida El Castillo yang berfungsi sebagai kalender astronomi."
        >
        </a-entity>
      </a-marker>

      <!-- 4. MENARA PISA (Barcode 3) -->
      <a-marker type="barcode" value="3" smooth="true">
        <a-entity 
          gltf-model="#pisa-glb"
          position="0 0 0" 
          scale="0.5 0.5 0.5" 
          class="clickable"
          gesture-handler
          info-click-handler="title: Menara Pisa; text: Menara lonceng katedral di Pisa, Italia. Terkenal karena kemiringannya yang tidak disengaja akibat pondasi tanah yang tidak stabil."
        >
        </a-entity>
      </a-marker>

      <!-- 5. PIRAMIDA GIZA (Barcode 4) -->
      <a-marker type="barcode" value="4" smooth="true">
        <a-entity 
          gltf-model="#giza-glb"
          position="0 0 0" 
          scale="0.01 0.01 0.01" 
          class="clickable"
          gesture-handler
          info-click-handler="title: Piramida Agung Giza; text: Piramida tertua dan terbesar dari tiga piramida di Giza, Mesir. Makam Firaun Khufu yang dibangun sekitar 2560 SM."
        >
        </a-entity>
      </a-marker>

      <!-- 6. PETRA (Barcode 5) -->
      <a-marker type="barcode" value="5" smooth="true">
        <a-entity 
          gltf-model="#petra-glb"
          position="0 0 0" 
          scale="0.05 0.05 0.05" 
          class="clickable"
          gesture-handler
          info-click-handler="title: Petra (Ad Deir); text: Situs arkeologi bersejarah di Yordania selatan. Terkenal dengan arsitektur yang dipahat langsung pada tebing batu merah."
        >
        </a-entity>
      </a-marker>

      <!-- 7. ANGKOR WAT (Barcode 6) -->
      <a-marker type="barcode" value="6" smooth="true">
        <a-entity 
          gltf-model="#angkor-glb"
          position="0 0 0" 
          scale="0.05 0.05 0.05" 
          class="clickable"
          gesture-handler
          info-click-handler="title: Angkor Wat; text: Kompleks candi terbesar di dunia yang terletak di Kamboja. Awalnya dibangun sebagai candi Hindu, kemudian berubah menjadi Buddha."
        >
        </a-entity>
      </a-marker>

      <!-- 8. KHERTVISI FORTRESS (Barcode 7) -->
      <a-marker type="barcode" value="7" smooth="true">
        <a-entity 
          gltf-model="#khertvisi-glb"
          position="0 0 0" 
          scale="0.1 0.1 0.1" 
          class="clickable"
          gesture-handler
          info-click-handler="title: Benteng Khertvisi; text: Salah satu benteng tertua di Georgia, terletak di tebing bebatuan tinggi di ngarai sungai Kura."
        >
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      document.querySelector('a-scene').addEventListener('loaded', function () {
        document.querySelector('.arjs-loader').style.display = 'none';
      });
    </script>
  </body>
</html>
